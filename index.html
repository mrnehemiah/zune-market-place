<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087a50">
  <meta name="description" content="ZUNE Marketplace — nunua na uza kwa urahisi.">
  <title>ZUNE Marketplace</title>
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/animations.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="./config/supabase-config.js"></script>
  <script src="./config/app-config.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <div class="boot-screen" role="status" aria-live="polite">
      <div class="boot-logo">Z</div><span>Inafungua ZUNE...</span>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
    }
  </script>
</body>
</html>
